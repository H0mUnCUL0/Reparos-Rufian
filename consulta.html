<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Reparos Rufián</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <header>
        <h1>Consulta de reparación</h1>
    </header>
    <main>
        <section>
            <h2>Consulta el estado de tu reparación</h2>
            <form id="form-consulta">
                <label for="codigo">Código de reparación:</label>
                <input type="text" id="codigo" name="codigo" required>
                <button type="submit">Consultar</button>
            </form>
            <div id="resultado-consulta" style="margin-top:2rem;"></div>
        </section>
    </main>
    <script src="reparacion_data.js"></script>
    <script>
    document.getElementById('form-consulta').addEventListener('submit', function(e) {
        e.preventDefault();
        const codigo = document.getElementById('codigo').value.trim().toUpperCase();
        const resultadoDiv = document.getElementById('resultado-consulta');
        const datos = window.reparosRufian.buscarReparacionPorCodigo(codigo);
        if (datos) {
            resultadoDiv.innerHTML = `
                <h3>Datos de la reparación</h3>
                <ul style="list-style:none;padding:0;">
                    <li><strong>Código:</strong> ${datos.codigo}</li>
                    <li><strong>Nombre:</strong> ${datos.nombre}</li>
                    <li><strong>Email:</strong> ${datos.email}</li>
                    <li><strong>Dispositivo:</strong> ${datos.dispositivo}</li>
                    <li><strong>Descripción:</strong> ${datos.descripcion}</li>
                    <li><strong>Estado:</strong> ${datos.estado}</li>
                </ul>
            `;
        } else {
            resultadoDiv.innerHTML = '<span style="color:#d32f2f;font-weight:bold;">No se ha encontrado ninguna reparación con ese código.</span>';
        }
    });
    </script>
    <footer>
        <p>&copy; 2026 Reparos Rufián. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
