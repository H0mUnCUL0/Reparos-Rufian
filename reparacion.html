<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar reparación - Reparos Rufián</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="logo1.png">
</head>
<body>
    <header>
        <h1>Solicitar reparación</h1>
    </header>
    <main>
        <section>
            <h2>Formulario de solicitud</h2>
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required pattern="^[a-zA-Z0-9._%+-]+@(gmail|hotmail)\.com$" title="El correo debe terminar en @gmail.com o @hotmail.com">
                <label for="dispositivo">Dispositivo:</label>
                <select id="dispositivo" name="dispositivo" required>
                    <option value="" disabled selected>Selecciona un dispositivo</option>
                    <option value="móvil">Móvil</option>
                    <option value="tablet">Tablet</option>
                    <option value="ordenador">Ordenador</option>
                    <option value="portátil">Portátil</option>
                    <option value="consola">Consola</option>
                </select>
                <label for="descripcion">Descripción del problema:</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
                <button type="submit">Enviar solicitud</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Reparos Rufián. Todos los derechos reservados.</p>
    </footer>
    <script src="reparacion_data.js"></script>
    <script src="confirmacion.js"></script>
</body>
</html>
