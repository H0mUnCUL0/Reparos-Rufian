<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar reparación - Reparos Rufián</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="logo1.png">
    <form id="form-reparacion"></form>
</head>
<body>
    <header>
        <h1>Solicitar reparación</h1>
    </header>
    <main>
        <section>
            <h2>Formulario de solicitud</h2>
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required pattern="^[a-zA-Z0-9._%+-]+@(gmail|hotmail)\.com$" title="El correo debe terminar en @gmail.com o @hotmail.com">
                <label for="dispositivo">Dispositivo:</label>
                <label>Selecciona tu dispositivo:</label>
<div class="dispositivo-selector">
    <label class="radio-card">
        <input type="radio" name="dispositivo" value="móvil" required>
        <div class="card-content">
            <img src="movil.png" alt="Móvil">
            <span>Móvil</span>
        </div>
    </label>

    <label class="radio-card">
        <input type="radio" name="dispositivo" value="tablet">
        <div class="card-content">
            <img src="tablet.png" alt="Tablet">
            <span>Tablet</span>
        </div>
    </label>

    <label class="radio-card">
        <input type="radio" name="dispositivo" value="ordenador">
        <div class="card-content">
            <img src="pc.png" alt="PC">
            <span>Ordenador</span>
        </div>
    </label>

    <label class="radio-card">
        <input type="radio" name="dispositivo" value="consola">
        <div class="card-content">
            <img src="consola.png" alt="Consola">
            <span>Consola</span>
        </div>
    </label>
    <label class="radio-card">
        <input type="radio" name="dispositivo" value="portatil">
        <div class="card-content">
            <img src="portatil.png" alt="portatil">
            <span>Portatil</span>
        </div>
    </label>
    <label class="radio-card">
        <input type="radio" name="dispositivo" value="otro">
        <div class="card-content">
            <img src="otro.png" alt="portatil">
            <span>Otro</span>
        </div>
    </label>
</div>
                <label for="descripcion">Descripción del problema:</label>
                <textarea id="descripcion" name="descripcion" required></textarea>
                <button type="submit">Enviar solicitud</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Reparos Rufián. Todos los derechos reservados.</p>
    </footer>
    <script src="reparacion_data.js"></script>
    <script src="confirmacion.js"></script>
</body>
</html>
