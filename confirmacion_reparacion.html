<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de reparación enviada - Reparos Rufián</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <header>
        <h1>Reparos Rufián</h1>
    </header>
    <main>
        <section style="max-width:600px;margin:2rem auto;padding:2rem;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.08);text-align:center;">
            <h2>¡Solicitud enviada!</h2>
            <p>Tu solicitud de reparación ha sido enviada correctamente.<br>Un agente responderá en el menor tiempo posible.</p>
            <div id="codigo-reparacion" style="margin:1.5rem 0;font-size:1.2rem;font-weight:bold;color:#2d3050;"></div>
            <a href="index.html" class="menu-btn-soph" style="margin-top:1.5rem;display:inline-block;">Volver al inicio</a>
        </section>
    </main>
    <script src="reparacion_data.js"></script>
    <script>
    // Mostrar el código de reparación generado
    const codigo = sessionStorage.getItem('codigoReparacion');
    if (codigo) {
        document.getElementById('codigo-reparacion').textContent = 'Tu código de reparación es: ' + codigo;
        sessionStorage.removeItem('codigoReparacion');
    }
    </script>
    <footer>
        <p>&copy; 2026 Reparos Rufián. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
