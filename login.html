<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Operadores - Reparos Rufián</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="logo1.png">
    <style>
        body { background: #2d3e50; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        .login-card h2 { color: #2d3e50; margin-bottom: 1.5rem; }
        .login-card input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .login-card button { width: 100%; padding: 0.8rem; background: #2d3e50; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-card button:hover { background: #ffb347; color: #2d3e50; }
        .error-msg { color: #d32f2f; font-size: 0.9rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo1.png" alt="Rufián" style="max-width: 120px; margin-bottom: 1rem;">
        <h2>Panel Técnico</h2>
        <form id="form-privado">
            <input type="text" id="usuario-op" placeholder="Usuario" required>
            <input type="password" id="pass-op" placeholder="Contraseña" required>
            <button type="submit">Entrar al Sistema</button>
        </form>
        <div id="error-login" class="error-msg">⚠️ Credenciales incorrectas</div>
        <p style="margin-top: 1.5rem;"><a href="index.html" style="color: #666; text-decoration: none; font-size: 0.8rem;">← Volver a la web</a></p>
    </div>

    <script src="reparacion_data.js"></script>
</body>
</html>
